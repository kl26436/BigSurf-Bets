name: Projections

# Re-project the week in play whenever something it depends on changed: new
# stats, a new injury status, a fresher salary export, new odds. Triggered by
# every ingest and slate import; a run whose inputs are identical to the last
# one's exits in seconds (--if-stale), so frequent status snapshots are cheap.
on:
  workflow_run:
    workflows: ["Weekly ingest", "DK slate import"]
    types: [completed]
  workflow_dispatch:
    inputs:
      season:
        description: "Season (blank = current)"
        required: false
      week:
        description: "Week (blank = the week in play)"
        required: false
      app_job_id:
        description: "bsb.app_jobs id to mark finished (set by the app)"
        required: false

concurrency:
  group: projections
  cancel-in-progress: false   # never kill a run that is minutes from finishing on a Sunday morning

env:
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  project:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[model]"

      # completed seasons never change — keep their nflverse files between runs
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nflverse-cache-v2

      - name: Apply migrations
        run: bsb db migrate

      # grade the last finished week first (no-op until that week has projections on file)
      - name: Scorecard
        continue-on-error: true
        run: bsb model scorecard

      - name: Train + project
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ -n "$SEASON" ]]; then args+=(--season "$SEASON"); fi
          if [[ -n "$WEEK" ]]; then args+=(--week "$WEEK"); fi
          if [[ "$EVENT" == "workflow_run" ]]; then args+=(--if-stale); fi
          bsb model project "${args[@]}"

      # Sleeper guillotine league: chop odds and waiver bids from the fresh projections
      - name: Waiver bids
        continue-on-error: true
        run: bsb league bids

      - uses: actions/upload-artifact@v4
        with:
          name: projections
          path: data/projections/*.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Tell the app
        if: always() && inputs.app_job_id != ''
        env:
          APP_JOB_ID: ${{ inputs.app_job_id }}
          OUTCOME: ${{ job.status }}
        run: |
          [[ "$APP_JOB_ID" =~ ^[0-9]+$ ]] || exit 0
          if [[ "$OUTCOME" == "success" ]]; then bsb app finish-job "$APP_JOB_ID" --ok; else bsb app finish-job "$APP_JOB_ID" --failed; fi
