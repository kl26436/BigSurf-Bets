name: App

# Build and test the web app on every change; deploy it to Firebase Hosting once
# the project exists. Deploying needs two things only the repo owner can add:
#   secret   FIREBASE_SERVICE_ACCOUNT   (Firebase console → Project settings → Service accounts → Generate key)
#   variable FIREBASE_PROJECT_ID
# Until both are there the job stops after the build and keeps the built site as an artifact.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run audit:design
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
          retention-days: 14
      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.FIREBASE_PROJECT_ID != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: app
