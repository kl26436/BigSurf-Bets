[project]
name = "bigsurf-bets"
version = "0.1.0"
description = "Big Surf Bets — NFL data ingestion, projection modeling, and DFS/sportsbook bet engines"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0,<3",
    "pyarrow>=15",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
model = [
    "lightgbm>=4.3",
    "scikit-learn>=1.4",   # lightgbm's LGBMRegressor wrapper needs it
    "numpy>=1.26",
    "scipy>=1.11",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
bsb = "ingest.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*", "model*", "optimizer*", "markets*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = ["E501"]

[tool.setuptools.package-data]
optimizer = ["*.json"]
